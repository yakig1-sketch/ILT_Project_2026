name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build typecheck test

  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  database:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.31.0-pg16
        env:
          POSTGRES_USER: ilt_owner
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: ilt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ilt_owner -d ilt" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://ilt_owner:ci-owner@localhost:5432/ilt
      ILT_APP_DB_PASSWORD: ci-app
      ILT_ANALYST_DB_PASSWORD: ci-analyst
      SEED_DEV_PASSWORD: ci-dev
      SEED_DIRECTOR_PIN: "135790"
      SEED_SKIP_VIDEOS: "1"
      TEST_DATABASE_URL: postgres://ilt_app:ci-app@localhost:5432/ilt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # The seed imports the built workspace packages (shared-types, template-schemas).
      - run: pnpm turbo run build --filter=@ilt/db...
      - run: pnpm db:seed
      # Gateway end-to-end flow against the migrated, seeded database (phase1.db.test.ts).
      - run: pnpm turbo run test --filter=@ilt/telemetry-gateway
