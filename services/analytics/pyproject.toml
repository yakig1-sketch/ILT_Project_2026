[project]
name = "ilt-analytics"
version = "0.1.0"
description = "ILT analytics service: kinematics, research exports, legacy import"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "numpy>=2.1",
  "scipy>=1.14",
  "duckdb>=1.1",
  "pyarrow>=18.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ilt_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
