# ILT development infrastructure. Run from the repo root:
#   pnpm infra:up      (uses .env; copy .env.example first)
# The gateway, analytics service and web apps run on the host during development.
name: ilt

services:
  db:
    image: timescale/timescaledb:2.31.0-pg16   # PostgreSQL 16.15 + TimescaleDB 2.31.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ilt_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ilt}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ilt_owner} -d ${POSTGRES_DB:-ilt}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage: instruction videos, hand video, canvas images, exports.
  # SeaweedFS replaces MinIO, which no longer publishes container images.
  s3:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ilt-s3}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "/etc/ilt/start-s3.sh"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data
      - ./s3/start-s3.sh:/etc/ilt/start-s3.sh:ro

  # Optional desk-camera relay (FRS §14). Start with: docker compose --profile video up -d
  go2rtc:
    image: alexxit/go2rtc:1.9.9
    profiles: ["video"]
    restart: unless-stopped
    network_mode: host

volumes:
  db-data:
  s3-data:
